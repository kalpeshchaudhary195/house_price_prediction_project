{% extends "base.html" %}

{% block title %}Create Account — PropValuate AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card custom-card p-4 shadow-md">
            <div class="text-center mb-4">
                <div class="stat-icon success mx-auto mb-2">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h4 class="fw-bold mb-1">Create an Account</h4>
                <p class="small text-muted mb-0">Join our real-estate valuation & analytics platform</p>
            </div>

            <div id="signup-alert" class="alert alert-danger d-none" role="alert"></div>

            <form id="signup-form">
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" required placeholder="e.g. Kalpesh Chaudhary">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" required placeholder="name@domain.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password (min 6 chars)</label>
                    <input type="password" class="form-control" id="password" required minlength="6" placeholder="••••••••">
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" id="signup-btn" class="btn btn-primary rounded-pill py-2">
                        Register Account
                    </button>
                </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top small text-muted">
                Already registered? <a href="{{ url_for('page_login') }}" class="text-primary fw-semibold text-decoration-none">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const full_name = document.getElementById('full_name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const alertBox = document.getElementById('signup-alert');
    const btn = document.getElementById('signup-btn');

    alertBox.classList.add('d-none');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Registering...';

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ full_name, email, password })
        });
        const json = await res.json();
        if (json.success) {
            window.location.href = "{{ url_for('page_dashboard') }}";
        } else {
            alertBox.textContent = json.message || 'Registration failed';
            alertBox.classList.remove('d-none');
        }
    } catch (err) {
        alertBox.textContent = 'Network error: ' + err.message;
        alertBox.classList.remove('d-none');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Register Account';
    }
});
</script>
{% endblock %}
